# Dovre on a VPS or home server (docs/SELF-HOST.md).
#   cp deploy/dovre.env.example deploy/dovre.env   # then fill it in
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml exec dovre cat data/launch-token
services:
  dovre:
    build: ..
    restart: unless-stopped
    env_file: dovre.env
    # Loopback only: the sign-in proxy on this host is the way in. Never publish 4848 on a public address.
    ports:
      - "127.0.0.1:4848:4848"
    volumes:
      - dovre-data:/app/data
      # Your checkouts, for the Code pane, worktrees and terminals (repos directly inside it).
      - ${DOVRE_CODE:-./code}:/code
      # Opt-in, off by default: the Docker pane sees this host's containers. The socket is root on
      # this host, so read "The Docker pane" in docs/SELF-HOST.md first. To turn it on, uncomment
      # this line and the group_add below, and set DOCKER_GID=$(stat -c %g /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
    # The socket's group, so the container's node user may open it.
    # group_add:
    #   - "${DOCKER_GID:?set DOCKER_GID to the socket's group id}"
volumes:
  dovre-data:
